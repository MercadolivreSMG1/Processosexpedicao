# Robô · Monitor de processos Expedição (SMG1) — ARQUIVO ÚNICO
# Cole este arquivo como  .github/workflows/robo.yml  e pronto: o coletor e o
# robô vão embutidos aqui (base64+gzip), não precisa subir mais nada.
name: robo-monitor-processos

on:
  schedule:
    - cron: "*/5 * * * *"        # a cada 5 min (o GitHub costuma atrasar para 8–15)
  workflow_dispatch:

concurrency:
  group: robo-processos
  cancel-in-progress: false

permissions:
  contents: read

