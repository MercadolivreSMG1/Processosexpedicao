          node -e "new Function(require('fs').readFileSync('coletor.js','utf8'))" && echo "coletor ok ($(wc -c < coletor.js) bytes)"

      - name: Dependências
        working-directory: robo
        run: npm install --omit=dev --no-audit --no-fund --silent

      - name: Cache do Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.0

      - name: Chromium
        working-directory: robo
        run: npx playwright install --with-deps chromium

      - name: Sessão do Meli
        working-directory: robo
        env:
          SESSAO_MELI: ${{ secrets.SESSAO_MELI }}
        run: |
          if [ -z "$SESSAO_MELI" ]; then echo "::error::O secret SESSAO_MELI está vazio."; exit 2; fi
          printf '%s' "$SESSAO_MELI" > sessao.json
          if [ -f sessao.enc ]; then echo "sessão renovada encontrada no repositório"; else echo "primeira execução: usando o secret"; fi

      - name: Coletar (uma passada em todos os ciclos)
        working-directory: robo
        env:
          COLETOR: ${{ github.workspace }}/coletor.js
          FIREBASE: https://expedicaoprojeto1-default-rtdb.firebaseio.com
          PAINEL: https://mercadolivresmg1.github.io/Processosexpedicao/
          OPERADOR: Robô GitHub
          SESSAO_CHAVE: ${{ secrets.SESSAO_CHAVE }}
          PROBE: ${{ inputs.sonda && '1' || '0' }}
        run: node robo.js uma-vez

      - name: Guardar a sessão renovada (cifrada)
        if: always()
        run: |
          rm -f robo/sessao.json robo/*.b64
          if [ -n "$(git status --porcelain robo/sessao.enc)" ]; then
            git config user.name "robo-processos"
            git config user.email "robo@users.noreply.github.com"
            git add robo/sessao.enc
            git commit -m "sessão renovada [skip ci]" -q
            git pull --rebase -q || true
            git push -q && echo "sessão renovada guardada no repositório"
          else
            echo "sessão sem mudança"
          fi

      - name: Se falhou, avisar o que fazer
        if: failure()
        run: |
          echo "::error title=Robô falhou::Se o motivo foi sessão expirada: 1) na tela do dispatch, F12 > Network > botão direito em waves-status > Copy as cURL (bash); 2) Settings > Secrets and variables > Actions > SESSAO_MELI > Update secret; 3) apague o arquivo robo/sessao.enc no repositório; 4) Actions > Run workflow."
