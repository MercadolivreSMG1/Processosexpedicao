# Robô · Monitor de processos Expedição (SMG1) — ARQUIVO ÚNICO
# Cole como  .github/workflows/robo.yml
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SESSAO_MELI   = o "Copy as cURL (bash)" da tela do dispatch (ou o sessao.json)
#   SESSAO_CHAVE  = uma senha qualquer, longa, inventada por você (cifra a sessão renovada)
#
# O robô guarda a sessão renovada em robo/sessao.enc (cifrada) e comita de volta:
# assim ela se renova a cada execução em vez de morrer em horas.
name: robo-monitor-processos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      sonda:
        description: "Mapear as APIs internas e imprimir o formato no log"
        type: boolean
        default: false

concurrency:
  group: robo-processos
  cancel-in-progress: false

permissions:
  contents: write           # para comitar a sessão renovada (cifrada)

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

